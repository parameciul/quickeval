<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MQGrader</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;0,800;1,400&family=Caveat:wght@600&display=swap"
    />
    <link rel="stylesheet" href="/src/ui/brand.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-bar">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="brand-mark-ring" gradientUnits="userSpaceOnUse" x1="12" y1="12" x2="52" y2="52">
                <stop offset="0" style="stop-color: var(--mark-from)" />
                <stop offset="1" style="stop-color: var(--mark-to)" />
              </linearGradient>
            </defs>
            <path d="M48.42 27.6A17 17 0 1 1 36.4 15.58" fill="none" stroke="url(#brand-mark-ring)" stroke-width="6" stroke-linecap="round" />
            <path d="M23 32L30 39L49 18" fill="none" stroke="var(--mark-tick)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-text">
            <span class="brand-name">MQGrader</span>
          </span>
        </a>
      </div>
    </header>
    <main class="wrap page landing">
      <h1>MQGrader</h1>
      <p class="lead">Corectarea testelor la matematică, rapid și în ordine.</p>
      <p><a class="button" href="/admin/">Intră ca profesor</a></p>
    </main>
    <footer class="site-footer">
      <div class="wrap"><p>MQGrader</p></div>
    </footer>
  </body>
</html>
